<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avalanche Token Ledger & Quant ML Studio</title>

  <!-- Google Fonts: Roboto Mono & UnifrakturMaguntia as specified in styles.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=UnifrakturMaguntia&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">

  <!-- Project Stylesheet from styles.css -->
  <link rel="stylesheet" href="/static/styles.css">

  <!-- React 18, ReactDOM, PropTypes, Recharts for Data Visualizations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>

  <style>
    /* Monochrome overrides and refinements based on styles.css */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --block-bg: #181818;
      --text-color: #f3f3f3;
      --text-muted: #888888;
      --border-color: #3e3e3e;
      --border-focus: #e0e0e0;
      /* Only data points carry vivid color */
      --data-green: #4ade80;
      --data-red: #f87171;
      --data-blue: #38bdf8;
      --data-amber: #fbbf24;
    }

    [data-theme="light"] {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --block-bg: #f9f9fb;
      --text-color: #18181b;
      --text-muted: #71717a;
      --border-color: #d4d4d8;
      --border-focus: #18181b;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Roboto Mono', monospace;
      margin: 0;
      padding: 0;
    }

    .nav-tabs-bar {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      font-family: 'Roboto Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      border-color: var(--text-color);
      background-color: var(--block-bg);
    }

    .tab-btn.active {
      background-color: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
    }

    .mono-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      font-family: 'Roboto Mono', monospace;
      font-size: 0.8rem;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mono-btn:hover {
      border-color: var(--text-color);
      background-color: var(--text-color);
      color: var(--bg-color);
    }
    .mono-btn-active {
      background-color: var(--text-color) !important;
      color: var(--bg-color) !important;
      border-color: var(--text-color) !important;
    }

    .run-pipeline-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--border-color);
      font-family: 'Roboto Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 20px;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .run-pipeline-btn:hover {
      border-color: var(--text-color);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
      background-color: var(--text-color);
      color: var(--bg-color);
    }

    /* Progress bar */
    .progress-bar-track {
      background: var(--block-bg);
      border: 1px solid var(--border-color);
      height: 8px;
      width: 100%;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--text-color);
      height: 100%;
      transition: width 0.3s ease;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border: 1px solid var(--border-color);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Token card styling */
    .token-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .token-card:hover {
      border-color: var(--text-color);
      transform: translateY(-2px);
    }

    /* Status badge colors */
    .status-paused {
      background: rgba(250, 160, 148, 0.18);
      border-color: #faa094 !important;
      color: #ffb4a8 !important;
    }
    .status-running {
      background: rgba(74, 222, 128, 0.14);
      border-color: var(--data-green) !important;
      color: var(--data-green) !important;
    }

    /* Distinct START and PAUSE button styles */
    .btn-pause-active {
      background: rgba(250, 160, 148, 0.16);
      border-color: #faa094;
      color: #ffb4a8;
      font-weight: 700;
    }
    .btn-pause-active:hover {
      background: #faa094;
      color: #121212;
      border-color: #faa094;
    }
    .btn-start-active {
      background: rgba(74, 222, 128, 0.12);
      border-color: var(--data-green);
      color: var(--data-green);
      font-weight: 700;
    }
    .btn-start-active:hover {
      background: var(--data-green);
      color: #121212;
      border-color: var(--data-green);
    }

    /* Pause Summary Toast Popup */
    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 340px;
      background: var(--card-bg);
      border: 1px solid #faa094;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      z-index: 2000;
      padding: 14px 16px 10px 16px;
      font-family: 'Roboto Mono', monospace;
    }
    .toast-timer-track {
      height: 3px;
      width: 100%;
      background: var(--border-color);
      margin-top: 10px;
      overflow: hidden;
    }
    .toast-timer-fill {
      height: 100%;
      background: #faa094;
      transition: width 0.05s linear;
    }

    /* Modal dialog */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      max-width: 900px;
      width: 92%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px;
    }
  </style>
</head>
<body>
  <!-- CRT Screen Overlay as specified in styles.css -->
  <div class="crt-overlay"></div>

  <div class="container">
    <!-- Top Header -->
    <header class="dashboard-header">
      <div>
        <h1 class="gothic" style="margin-bottom: 4px; border-bottom: none; padding-bottom: 0;">
          Avalanche Token Ledger & Quant ML Studio
        </h1>
        <div style="font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.06em;">
          ON-CHAIN TRANSACTION INDEXER, PRICE RECONSTRUCTION & ML FORECASTING
        </div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="mono-btn" id="theme-toggle-btn" onclick="toggleTheme()">THEME: DARK</button>
      </div>
    </header>

    <!-- Top Navigation Tabs -->
    <div class="nav-tabs-bar">
      <div style="display: flex; gap: 8px;">
        <button class="tab-btn" id="tab-btn-sourcing" onclick="switchMainTab('sourcing')">
          1. Blockchain Data & Sourcing
        </button>
        <button class="tab-btn active" id="tab-btn-analysis" onclick="switchMainTab('analysis')">
          2. Quant ML Analysis & Backtesting
        </button>
      </div>
      <div style="font-size: 0.78rem; color: var(--text-muted);">
        ACTIVE TOKEN: <strong id="active-token-label" style="color: var(--text-color);">NOCHILL (0xAcFb...b9a5)</strong>
      </div>
    </div>

    <!-- TAB 1: BLOCKCHAIN SOURCING & TOKENS -->
    <div id="tab-content-sourcing" style="display: none;">
      <!-- Sourcing Controls & Ingestion -->
      <div class="content-block" style="margin-bottom: 20px;">
        <h3 class="gothic">Initiate Token Contract Sweep</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
          <input
            type="text"
            id="new-token-address"
            placeholder="Avalanche C-Chain Contract Address (0x...)"
            style="flex: 1; min-width: 320px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 12px; font-family: 'Roboto Mono', monospace; font-size: 0.85rem;"
          />
          <button class="mono-btn" onclick="startTrackingToken()" style="font-weight: 700;">
            COMMENCE SWEEP
          </button>
        </div>
      </div>

      <!-- Active Tracked Tokens Grid -->
      <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
        <h2 class="gothic" style="margin: 0; font-size: 1.6rem;">Tracked Ledger Assets</h2>
        <button class="mono-btn" onclick="fetchCoinsList()">REFRESH STATUS</button>
      </div>
      <div class="grid" id="coins-container">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- TAB 2: QUANT ML ANALYSIS & BACKTEST (React Application Mounted Here) -->
    <div id="tab-content-analysis">
      <div id="react-analysis-root"></div>
    </div>
  </div>

  <!-- Token Profile Modal Dialog -->
  <div id="profile-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">
        <h2 class="gothic" id="modal-token-title" style="margin: 0;">Token Holder Profile</h2>
        <button class="mono-btn" onclick="closeProfileModal()">CLOSE [ESC]</button>
      </div>
      <div id="modal-token-body">
        <!-- Profile metrics dynamically rendered -->
      </div>
    </div>
  </div>

  <!-- Pause Summary Toast Popup (Hovering stalls auto-dismiss timer) -->
  <div id="pause-toast" class="toast-popup" style="display: none;" onmouseenter="stallPauseToast()" onmouseleave="resumePauseToast()">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <span id="pause-toast-title" style="font-size: 0.82rem; font-weight: 700; color: #ffb4a8;">INDEXING PAUSED</span>
      <button onclick="closePauseToast()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-family: monospace; font-size: 0.9rem;">[x]</button>
    </div>
    <div id="pause-toast-body" style="font-size: 0.78rem; line-height: 1.5; color: var(--text-color);"></div>
    <div id="pause-toast-hint" style="font-size: 0.68rem; color: var(--text-muted); margin-top: 6px;">Hover to pause timer</div>
    <div class="toast-timer-track">
      <div id="pause-toast-bar" class="toast-timer-fill" style="width: 100%;"></div>
    </div>
  </div>

  <!-- TAB 1 Plain JS Logic for Sourcing & Tokens -->
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute("data-theme") || "dark";
      const next = current === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      document.getElementById("theme-toggle-btn").innerText = "THEME: " + next.toUpperCase();
    }

    function switchMainTab(tab) {
      const sourcingBtn = document.getElementById("tab-btn-sourcing");
      const analysisBtn = document.getElementById("tab-btn-analysis");
      const sourcingContent = document.getElementById("tab-content-sourcing");
      const analysisContent = document.getElementById("tab-content-analysis");

      if (tab === "sourcing") {
        sourcingBtn.classList.add("active");
        analysisBtn.classList.remove("active");
        sourcingContent.style.display = "block";
        analysisContent.style.display = "none";
        fetchCoinsList();
      } else {
        analysisBtn.classList.add("active");
        sourcingBtn.classList.remove("active");
        analysisContent.style.display = "block";
        sourcingContent.style.display = "none";
      }
    }

    function fetchCoinsList() {
      fetch("/api/coins")
        .then((r) => r.json())
        .then((coins) => {
          renderCoinsGrid(coins);
        })
        .catch((err) => console.error("Error fetching coins:", err));
    }

    function renderCoinsGrid(coins) {
      const container = document.getElementById("coins-container");
      if (!coins || coins.length === 0) {
        container.innerHTML = "<div class='content-block'>No tokens currently tracked.</div>";
        return;
      }

      container.innerHTML = coins.map((c) => {
        const m = c.metrics || {};
        const isRunning = c.status === "RUNNING";
        const isPaused = !isRunning && (c.status === "PAUSED" || !c.status);
        const badgeClass = isRunning ? "status-running" : (isPaused ? "status-paused" : "");
        const safeSym = (c.symbol || "TOKEN").replace(/'/g, "");
        const safeName = (c.name || c.address || "").replace(/'/g, "");
        return `
          <div class="token-card" onclick="openTokenAnalysis('${c.address}', '${safeSym}', '${safeName}')" title="Click to open Quant ML Analysis for ${safeSym}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
              <div>
                <h3 class="gothic" style="margin: 0; font-size: 1.4rem;">${c.symbol || 'TOKEN'}</h3>
                <div style="font-size: 0.75rem; color: var(--text-muted);">${c.name || c.address}</div>
              </div>
              <span class="status-badge ${badgeClass}">
                ${c.status || 'PAUSED'}
              </span>
            </div>

            <div style="font-size: 0.8rem; margin-bottom: 12px; line-height: 1.6;">
              <div>TRANSACTIONS: <strong>${(c.collected_count || 0).toLocaleString()}</strong></div>
              <div>TIMELINE COVERAGE: <strong>${m.time_pct || 0}%</strong></div>
              <div>LAST BLOCK: <strong>${c.last_block || 0}</strong></div>
            </div>

            <div class="progress-bar-track" style="margin-bottom: 12px;">
              <div class="progress-bar-fill" style="width: ${Math.min(100, m.time_pct || 0)}%;"></div>
            </div>

            <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
              ${
                isRunning
                  ? `<button class="mono-btn btn-pause-active" onclick="event.stopPropagation(); pauseToken('${c.address}')">PAUSE</button>`
                  : `<button class="mono-btn btn-start-active" onclick="event.stopPropagation(); startToken('${c.address}')">START</button>`
              }
              <button class="mono-btn" onclick="event.stopPropagation(); openProfileModal('${c.address}', '${safeSym}')">PROFILE</button>
              <a href="/api/download/${c.address}" onclick="event.stopPropagation();" class="mono-btn" style="text-decoration: none;">CSV</a>
              <span style="margin-left: auto; font-size: 0.68rem; color: var(--text-muted);">OPEN ML &rarr;</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function openTokenAnalysis(addr, symbol, name) {
      window.selectedToken = { address: addr, symbol: symbol || "TOKEN", name: name || addr };
      const labelEl = document.getElementById("active-token-label");
      if (labelEl) {
        labelEl.innerText = `${window.selectedToken.symbol} (${addr.slice(0, 6)}...${addr.slice(-4)})`;
      }
      window.dispatchEvent(new CustomEvent("tokenSelected", { detail: window.selectedToken }));
      switchMainTab("analysis");
    }

    // Pause Toast Timer Logic
    let toastInterval = null;
    let toastRemainingMs = 5000;
    const TOAST_DURATION_MS = 5000;
    let toastStalled = false;

    function showPauseToast(symbol, sessionFetched, totalSaved) {
      const toast = document.getElementById("pause-toast");
      const title = document.getElementById("pause-toast-title");
      const body = document.getElementById("pause-toast-body");
      const bar = document.getElementById("pause-toast-bar");

      title.innerText = `INDEXING PAUSED - ${symbol || 'TOKEN'}`;
      body.innerHTML = `
        <div>Fetched this session: <strong>+${(sessionFetched || 0).toLocaleString()} txs</strong></div>
        <div>Total saved to disk: <strong>${(totalSaved || 0).toLocaleString()} txs</strong></div>
      `;

      toastRemainingMs = TOAST_DURATION_MS;
      toastStalled = false;
      bar.style.width = "100%";
      toast.style.display = "block";

      if (toastInterval) clearInterval(toastInterval);
      toastInterval = setInterval(() => {
        if (toastStalled) return;
        toastRemainingMs -= 50;
        const pct = Math.max(0, (toastRemainingMs / TOAST_DURATION_MS) * 100);
        bar.style.width = pct + "%";
        if (toastRemainingMs <= 0) {
          closePauseToast();
        }
      }, 50);
    }

    function stallPauseToast() {
      toastStalled = true;
      const hint = document.getElementById("pause-toast-hint");
      if (hint) hint.innerText = "Timer paused while hovering";
    }

    function resumePauseToast() {
      toastStalled = false;
      const hint = document.getElementById("pause-toast-hint");
      if (hint) hint.innerText = "Hover to pause timer";
    }

    function closePauseToast() {
      if (toastInterval) {
        clearInterval(toastInterval);
        toastInterval = null;
      }
      const toast = document.getElementById("pause-toast");
      if (toast) toast.style.display = "none";
    }

    function startToken(addr) {
      fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ address: addr })
      }).then(() => setTimeout(fetchCoinsList, 300));
    }

    function pauseToken(addr) {
      fetch("/api/pause", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ address: addr })
      })
        .then((r) => r.json())
        .then((res) => {
          showPauseToast(res.symbol, res.session_fetched, res.total_saved);
          setTimeout(fetchCoinsList, 300);
        });
    }

    function startTrackingToken() {
      const input = document.getElementById("new-token-address");
      const addr = input.value.trim();
      if (!addr) return;
      startToken(addr);
      input.value = "";
    }

    function openProfileModal(addr, symbol) {
      const modal = document.getElementById("profile-modal");
      const title = document.getElementById("modal-token-title");
      const body = document.getElementById("modal-token-body");
      title.innerText = `Token Profile: ${symbol || 'Token'} (${addr.slice(0, 10)}...)`;
      body.innerHTML = "<div style='padding: 20px; text-align: center;'>Computing on-chain wallet metrics & Gini distribution...</div>";
      modal.style.display = "flex";

      fetch(`/api/profile/${addr}`)
        .then((r) => r.json())
        .then((data) => {
          const s = data.summary || {};
          const users = data.users || [];
          body.innerHTML = `
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px;">
              <div class="content-block" style="padding: 10px; margin: 0;">
                <div style="font-size: 0.75rem; color: var(--text-muted);">TOTAL HOLDERS</div>
                <div style="font-size: 1.2rem; font-weight: 700;">${(s.holder_count || users.length).toLocaleString()}</div>
              </div>
              <div class="content-block" style="padding: 10px; margin: 0;">
                <div style="font-size: 0.75rem; color: var(--text-muted);">GINI COEFFICIENT</div>
                <div style="font-size: 1.2rem; font-weight: 700;">${s.gini || 0}</div>
              </div>
              <div class="content-block" style="padding: 10px; margin: 0;">
                <div style="font-size: 0.75rem; color: var(--text-muted);">TOP 10 CONCENTRATION</div>
                <div style="font-size: 1.2rem; font-weight: 700;">${s.top10_share_pct || 0}%</div>
              </div>
            </div>

            <h3 class="gothic" style="margin-bottom: 10px;">Top Ranked Wallets</h3>
            <div style="max-height: 380px; overflow-y: auto;">
              <table style="width: 100%; font-size: 0.8rem; border-collapse: collapse; text-align: left;">
                <thead>
                  <tr style="border-bottom: 1px solid var(--border-color); color: var(--text-muted);">
                    <th style="padding: 6px;">#</th>
                    <th style="padding: 6px;">WALLET ADDRESS</th>
                    <th style="padding: 6px;">BALANCE</th>
                    <th style="padding: 6px; text-align: right;">SHARE %</th>
                  </tr>
                </thead>
                <tbody>
                  ${users.slice(0, 50).map((u, i) => `
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                      <td style="padding: 6px; color: var(--text-muted);">${i + 1}</td>
                      <td style="padding: 6px; font-family: monospace;">${u.address}</td>
                      <td style="padding: 6px;">${Number(u.balance).toLocaleString()}</td>
                      <td style="padding: 6px; text-align: right;">${u.pct_supply || 0}%</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `;
        })
        .catch((err) => {
          body.innerHTML = `<div style="color: var(--data-red);">Error loading profile: ${err.message}</div>`;
        });
    }

    function closeProfileModal() {
      document.getElementById("profile-modal").style.display = "none";
    }

    // Auto-poll coins list when on sourcing tab
    setInterval(() => {
      const sourcingContent = document.getElementById("tab-content-sourcing");
      if (sourcingContent.style.display !== "none") {
        fetchCoinsList();
      }
    }, 4000);
  </script>

  <!-- Load Babel JSX Analysis Component -->
  <script type="text/babel" src="/static/analysis_dashboard.js"></script>
</body>
</html>
